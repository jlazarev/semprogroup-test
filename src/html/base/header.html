<header class="header @@if (context.mod) { header--@@mod }">
  <div class="header__wrapper">
    <div class="header__wrapper-top">
      <div class="header__block">
        <div class="header__block-side header__block-side--left">
          <button class="header__menu-btn" type="button" aria-label="меню">
            <div class="header__burger-menu">
              <div class="header__menu-top-line"></div>
              <div class="header__menu-bottom-line"></div>
            </div>
            <span>меню</span>
          </button>
        </div>

        <div class="header__location header__location--top">
          <button class="header__menu-apart btn" type="button">
            <span class="btn__text">
              <span class="btn__text-inner" data-hover="Выбрать квартиру">Выбрать квартиру</span>
            </span>
            <svg
              width="12"
              height="13"
              viewBox="0 0 12 13"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <use xlink:href="#arrow-down"></use>
            </svg>
          </button>
        </div>

        <a
          class="header__logo"
          @@if
          (!context.main)
          {href="index.html"
          }
          aria-label="Переход на главную"
        >
          <svg
            width="156"
            height="25"
            viewBox="0 0 156 25"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <use xlink:href="#inchapin_logo"></use>
          </svg>
        </a>

        <div class="header__block-side header__block-side--right">
          <div class="header__phone-block header__phone-block--top">
            <span class="header__phone-number">+7 495 527 21 21</span>
          </div>

          <button class="header__menu-request btn link-popup" type="button">
            <span class="btn__text">
              <span class="btn__text-inner" data-hover="Заказать звонок">Заказать звонок</span>
            </span>
            <div class="header__icon-phone">
              <svg
                width="14"
                height="14"
                viewBox="0 0 14 14"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <use xlink:href="#phone"></use>
              </svg>
            </div>
          </button>
        </div>
      </div>
    </div>

    <div class="header__menu">
      <ul class="header__menu-block">
        <li><a class="header__menu-link" href="#">О компании</a></li>
        <li><a class="header__menu-link" href="#">О компании</a></li>
        <li><a class="header__menu-link" href="#">О компании</a></li>
        <li><a class="header__menu-link" href="#">О компании</a></li>
        <li><a class="header__menu-link" href="#">Договоры</a></li>
        <li><a class="header__menu-link" href="#">Вопросы и ответы</a></li>
        <li><a class="header__menu-link" href="#">Контакты</a></li>
        <li><a class="header__menu-link" href="#">Контакты</a></li>
        <li><a class="header__menu-link" href="#">Контакты</a></li>
      </ul>

      <div class="header__location">
        <span class="header__location-discription"> Санкт-Петербурге </span>

        <div class="header__location-address">
          <svg
            width="14"
            height="19"
            viewBox="0 0 14 19"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <use xlink:href="#pin"></use>
          </svg>

          ул. Графтио, д. 3
        </div>
      </div>

      <div class="header__block-down">
        <div class="header__phone-block">
          <span class="header__phone-number">+7 495 527 21 21</span>

          <button class="header__phone-callback" type="button">Заказать обратный звонок</button>
        </div>
      </div>
    </div>
  </div>
</header>
